<!-- @dsCard height=300 -->
<style>
.cv{position:relative;width:960px;height:300px;background:var(--paper);overflow:hidden}
.cv svg{position:absolute;inset:0}
.g{fill:var(--staff-green)}.y{fill:var(--garment-rescue-yellow)}.r{fill:var(--hotel-solvane)}.b{fill:var(--hotel-thalene)}.s{fill:var(--stone-2)}
.w{fill:none;stroke:var(--paper);stroke-width:4px}
.t{position:absolute;left:48px;bottom:40px;max-width:400px}
.t h1{margin:0;font-family:var(--font-serif);font-weight:400;font-size:80px;line-height:.95;letter-spacing:-.03em;color:var(--ink)}
.t p{margin:16px 0 0;font-family:var(--font-sans);font-size:14px;color:var(--ink-2)}
</style>
<div class="cv">
<svg viewBox="0 0 960 300" width="960" height="300" aria-hidden="true">
<!-- blocks: staff-green 160x300 slab, garment-rescue-yellow 160x184, hotel-solvane 160x100, hotel-thalene 128x120, stone-2 128x164; all radius-0
     arrangement: one tall slab with satellites, flush on a space-4 (16px) gutter, bleeding top, bottom and right like a hotel luggage label
     pattern: literal motif (the Riviera pool wave from Hôtel Solvane's crest) because the brand's own crests are built from waves, arcs and engraved lines
     steps and radii: gaps space-4, wave pitch space-4, stroke paper at 4px, radius-0 throughout -->
<rect class="g" x="480" y="0" width="160" height="300"/>
<rect class="y" x="656" y="0" width="160" height="184"/>
<rect class="r" x="656" y="200" width="160" height="100"/>
<rect class="b" x="832" y="0" width="128" height="120"/>
<rect class="s" x="832" y="136" width="128" height="164"/>
<path class="w" d="M480 112q20-12 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0"/>
<path class="w" d="M480 128q20-12 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0"/>
<path class="w" d="M480 144q20-12 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0"/>
</svg>
<div class="t"><h1>Off Duty<br>Hotel Club</h1><p>Uniforms for places you wish existed.</p></div>
</div>
